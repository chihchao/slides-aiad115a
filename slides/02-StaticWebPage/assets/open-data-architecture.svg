<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 565" width="1400" height="565" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', 'PingFang TC', Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
    <marker id="arrowhead-accent" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ae3ec9" />
    </marker>
    
    <!-- Shadow Filter -->
    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <filter id="badge-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Section 1: Data Provider Layer -->
  <rect x="50" y="35" width="1300" height="245" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6 4" />
  <rect x="70" y="20" width="280" height="28" rx="6" fill="#e2e8f0" />
  <text x="82" y="39" font-size="13" font-weight="700" fill="#334155">【 數據源與服務層 Data Provider Layer 】</text>

  <!-- Section 2: Client Layer -->
  <rect x="50" y="320" width="1300" height="245" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6 4" />
  <rect x="70" y="305" width="300" height="28" rx="6" fill="#e2e8f0" />
  <text x="82" y="324" font-size="13" font-weight="700" fill="#334155">【 用戶端與展示層 Client &amp; Presentation Layer 】</text>

  <!-- STEP 01: 政府機關 -->
  <g transform="translate(80, 70)">
    <rect width="340" height="180" rx="12" fill="#e7f5ff" stroke="#339af0" stroke-width="2" filter="url(#card-shadow)" />
    <rect x="16" y="16" width="76" height="24" rx="12" fill="#1c7ed6" filter="url(#badge-shadow)" />
    <text x="54" y="32" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">STEP 01</text>
    <text x="16" y="68" font-size="19" font-weight="700" fill="#1864ab">政府機關</text>
    <text x="110" y="68" font-size="13" font-weight="500" fill="#495057">(Government Agencies)</text>
    <text x="16" y="102" font-size="13.5" font-weight="400" fill="#343a40">
      <tspan x="16" dy="0">• 產出業務與統計原始數據</tspan>
      <tspan x="16" dy="22">• 行政施政、氣象、交通等資料</tspan>
      <tspan x="16" dy="22">• 定期維護與資料開放政策</tspan>
    </text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g>
    <line x1="420" y1="160" x2="500" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)" />
    <rect x="428" y="137" width="64" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="460" y="151" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">提供數據</text>
  </g>

  <!-- STEP 02: 開放資料平台 -->
  <g transform="translate(510, 70)">
    <rect width="340" height="180" rx="12" fill="#e6fcf5" stroke="#20c997" stroke-width="2" filter="url(#card-shadow)" />
    <rect x="16" y="16" width="76" height="24" rx="12" fill="#0ca678" filter="url(#badge-shadow)" />
    <text x="54" y="32" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">STEP 02</text>
    <text x="16" y="68" font-size="19" font-weight="700" fill="#087f5b">開放資料平台</text>
    <text x="145" y="68" font-size="13" font-weight="500" fill="#495057">(Open Data Portal)</text>
    <text x="16" y="102" font-size="13.5" font-weight="400" fill="#343a40">
      <tspan x="16" dy="0">• data.gov.tw 集中託管平台</tspan>
      <tspan x="16" dy="22">• 資料品質審核與格式化</tspan>
      <tspan x="16" dy="22">• 宣告 OGDL 政府資料開放授權</tspan>
    </text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g>
    <line x1="850" y1="160" x2="930" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)" />
    <rect x="858" y="137" width="64" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="890" y="151" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">釋出 API</text>
  </g>

  <!-- STEP 03: API / JSON -->
  <g transform="translate(940, 70)">
    <rect width="340" height="180" rx="12" fill="#e3fafc" stroke="#15aabf" stroke-width="2" filter="url(#card-shadow)" />
    <rect x="16" y="16" width="76" height="24" rx="12" fill="#1098ad" filter="url(#badge-shadow)" />
    <text x="54" y="32" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">STEP 03</text>
    <text x="16" y="68" font-size="19" font-weight="700" fill="#0b7285">API / JSON</text>
    <text x="120" y="68" font-size="13" font-weight="500" fill="#495057">(Data Endpoint)</text>
    <text x="16" y="102" font-size="13.5" font-weight="400" fill="#343a40">
      <tspan x="16" dy="0">• RESTful API 端點對外服務</tspan>
      <tspan x="16" dy="22">• 結構化 JSON / CSV 資料格式</tspan>
      <tspan x="16" dy="22">• 配置 CORS 與 HTTP 快取標頭</tspan>
    </text>
  </g>

  <!-- Bridge Arrow: STEP 03 -> STEP 04 -->
  <g>
    <path d="M 1110 250 L 1110 295 Q 1110 310 1095 310 L 265 310 Q 250 310 250 325 L 250 345" fill="none" stroke="#ae3ec9" stroke-width="2.5" stroke-dasharray="6 3" marker-end="url(#arrowhead-accent)" />
    <rect x="580" y="298" width="220" height="24" rx="12" fill="#f3d9fa" stroke="#ae3ec9" stroke-width="1.5" />
    <text x="690" y="314" font-size="12" font-weight="700" fill="#862e9c" text-anchor="middle">HTTP GET 請求 (CORS API Fetch)</text>
  </g>

  <!-- STEP 04: fetch() 取得資料 -->
  <g transform="translate(80, 355)">
    <rect width="340" height="180" rx="12" fill="#f3d9fa" stroke="#cc5de8" stroke-width="2" filter="url(#card-shadow)" />
    <rect x="16" y="16" width="76" height="24" rx="12" fill="#ae3ec9" filter="url(#badge-shadow)" />
    <text x="54" y="32" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">STEP 04</text>
    <text x="16" y="68" font-size="19" font-weight="700" fill="#862e9c">fetch() 取得資料</text>
    <text x="175" y="68" font-size="13" font-weight="500" fill="#495057">(Data Fetching)</text>
    <text x="16" y="102" font-size="13.5" font-weight="400" fill="#343a40">
      <tspan x="16" dy="0">• 前端非同步網絡請求 (Async)</tspan>
      <tspan x="16" dy="22">• await fetch(url) 獲取 Raw Data</tspan>
      <tspan x="16" dy="22">• res.ok 與 HTTP 狀態碼檢查</tspan>
    </text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <g>
    <line x1="420" y1="445" x2="500" y2="445" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)" />
    <rect x="424" y="422" width="72" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="460" y="436" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Raw JSON</text>
  </g>

  <!-- STEP 05: JavaScript 解析與整理 -->
  <g transform="translate(510, 355)">
    <rect width="340" height="180" rx="12" fill="#fff4e6" stroke="#ff922b" stroke-width="2" filter="url(#card-shadow)" />
    <rect x="16" y="16" width="76" height="24" rx="12" fill="#f76707" filter="url(#badge-shadow)" />
    <text x="54" y="32" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">STEP 05</text>
    <text x="16" y="68" font-size="19" font-weight="700" fill="#d9480f">JS 解析與整理</text>
    <text x="155" y="68" font-size="13" font-weight="500" fill="#495057">(Data Logic)</text>
    <text x="16" y="102" font-size="13.5" font-weight="400" fill="#343a40">
      <tspan x="16" dy="0">• response.json() 反序列化物件</tspan>
      <tspan x="16" dy="22">• Array filter / map / reduce 轉置</tspan>
      <tspan x="16" dy="22">• 欄位清洗、數值計算與排序</tspan>
    </text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <g>
    <line x1="850" y1="445" x2="930" y2="445" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowhead)" />
    <rect x="852" y="422" width="76" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="890" y="436" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Clean Data</text>
  </g>

  <!-- STEP 06: HTML 顯示清單或圖表 -->
  <g transform="translate(940, 355)">
    <rect width="340" height="180" rx="12" fill="#ebfbee" stroke="#51cf66" stroke-width="2" filter="url(#card-shadow)" />
    <rect x="16" y="16" width="76" height="24" rx="12" fill="#37b24d" filter="url(#badge-shadow)" />
    <text x="54" y="32" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">STEP 06</text>
    <text x="16" y="68" font-size="19" font-weight="700" fill="#2b8a3e">HTML 顯示清單/圖表</text>
    <text x="195" y="68" font-size="13" font-weight="500" fill="#495057">(UI Presentation)</text>
    <text x="16" y="102" font-size="13.5" font-weight="400" fill="#343a40">
      <tspan x="16" dy="0">• 動態 DOM 節點生成與掛載</tspan>
      <tspan x="16" dy="22">• HTML Table / Card 資料卡清單</tspan>
      <tspan x="16" dy="22">• Chart.js / D3 數據視覺化圖表</tspan>
    </text>
  </g>
</svg>